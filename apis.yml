aid: bondai
name: Bondai
description: >-
  Bondai is a group-travel planning and booking platform, delivered primarily as a
  mobile app, that helps friends organize trips together in one place. It targets
  millennials and tackles the friction of collaborative travel by combining itinerary
  coordination, deal discovery, destination inspiration, group communication, expense
  splitting, and booking of experiences into a single social workflow. The company frames
  its mission around "travel dreams made real" and lasting friendships formed through
  travel. Bondai also curates and sells local experiences and stays (villas, tours, and
  guided outings), with early activity concentrated around Saudi Arabian destinations such
  as AlUla, Makkah, Madina, Jazan, and Tabuk. It is a consumer travel product with no
  public developer API, SDK, or documentation surface at this time. Bondai is a portfolio
  company of 500 Global and was added to the API Evangelist network as a company profile.
